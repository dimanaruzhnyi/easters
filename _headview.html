<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Хедер — preview</title>
  <link href="css/index.css" rel="stylesheet">
  <style>body{margin:0}</style>
</head>
<body>
  <div class="page">
    <header class="header">
      <div class="header__inner">
        <a class="header__logo" href="/">
          <img class="header__logo-img" src="data/logo-tulip.png" alt="Тюльпани">
        </a>
        <nav class="header__nav">
          <ul class="header__menu">
            <li><a href="/perevagy">Переваги</a></li>
            <li><a href="/produkciya">Продукція</a></li>
            <li><a href="/galereya">Галерея</a></li>
            <li><a href="/pro-nas">Про нас</a></li>
            <li><a href="/kontakty">Контакти</a></li>
          </ul>
        </nav>
        <div class="header__tools">
          <div class="header__account">
            <svg class="header__ico" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="8" r="3.6" stroke="currentColor" stroke-width="1.6"/><path d="M5 20c0-3.6 3.1-5.5 7-5.5s7 1.9 7 5.5" stroke="currentColor" stroke-width="1.6"/></svg>
            <span class="header__account-links"><a href="/login">вхід</a> <i>|</i> <a href="/register">реєстрація</a></span>
          </div>
          <div class="header__lang">
            <a href="/ru">RU</a>
            <i class="header__lang-sep">|</i>
            <a class="is-active" href="/ua">UA</a>
          </div>
          <button class="header__search" type="button" aria-label="Пошук">
            <svg class="header__ico" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="11" cy="11" r="6.5" stroke="currentColor" stroke-width="1.7"/><path d="M20 20l-4.2-4.2" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
          </button>
          <a class="header__cart" href="/cart" aria-label="Кошик">
            <svg class="header__cart-ico" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 8h12l-1.2 10.2a1 1 0 0 1-1 .8H8.2a1 1 0 0 1-1-.8L6 8z" fill="currentColor"/><path d="M9 8a3 3 0 0 1 6 0" stroke="currentColor" stroke-width="1.7" fill="none"/></svg>
            <span class="header__cart-count">0</span>
          </a>
        </div>
      </div>
    </header>

    <div class="hero">
      <div class="hero-slide">
        <div class="hero__inner">
          <div class="hero__panel">
            <svg class="hero__leaf" viewBox="0 0 40 40" fill="none" aria-hidden="true"><path d="M4 36C4 20 20 4 36 4c0 16-16 32-32 32z" fill="#cfe08a"/><path d="M11 29c4-7 10-12 17-14" stroke="#85aa12" stroke-width="1.8" stroke-linecap="round"/></svg>
            <span class="hero__label">Паперові форми</span>
            <div class="hero__title">Тюльпани</div>
            <p class="hero__text">Дуже корисний та функціональний винахід, що дозволяє полегшити працю кондитерам та просто любителям поекспериментувати на кухні.</p>
            <a class="btn btn--green hero__btn" href="/tyulpany">Переглянути продукцію</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
